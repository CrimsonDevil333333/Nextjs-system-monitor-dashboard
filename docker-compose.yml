services:
  sys-monitor:
    build: .
    container_name: sys-monitor
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DEV_AUTH=${DEV_AUTH:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
      - ./data:/app/data
    privileged: true
    network_mode: host
